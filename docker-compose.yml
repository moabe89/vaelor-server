name: vaelor
# Versao deploy VPS — login server desativado por enquanto (porta 80/8080 ocupadas pelo Traefik/evolution-api)
# Sera ativado depois com labels Traefik para rotear funnyotserv.com.br
services:
  database:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canary}
      MYSQL_USER: ${MYSQL_USER:-canary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?obrigatorio - veja .env.example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?obrigatorio - veja .env.example}
    # Banco SO escuta na rede interna do Docker (NAO exposto na internet)
    expose:
      - "3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./canary/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_USER: ${MYSQL_USER:-canary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?obrigatorio - veja .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canary}
    ports:
      - "7171:7171"
      - "7172:7172"
    depends_on:
      database:
        condition: service_healthy

  # =============================================================================
  # LOGIN SERVER (HTTP) — DESATIVADO TEMPORARIAMENTE
  # =============================================================================
  # Sera reativado depois que configurarmos labels Traefik para rotear
  # funnyotserv.com.br -> este container na porta 80 (interna).
  #
  # login:
  #   image: opentibiabr/login-server:latest
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_HOST: database
  #     MYSQL_PORT: 3306
  #     MYSQL_DBNAME: ${MYSQL_DATABASE:-canary}
  #     MYSQL_USER: ${MYSQL_USER:-canary}
  #     MYSQL_PASS: ${MYSQL_PASSWORD:?obrigatorio - veja .env.example}
  #     SERVER_NAME: ${SERVER_NAME:-Vaelor}
  #     SERVER_IP: ${SERVER_IP:-funnyotserv.com.br}
  #     SERVER_PORT: ${SERVER_PORT:-7172}
  #     SERVER_LOCATION: ${SERVER_LOCATION:-BRA}
  #     LOGIN_HTTP_PORT: 80
  #     LOGIN_GRPC_PORT: 9090
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.vaelor-login.rule=Host(`funnyotserv.com.br`)"
  #     - "traefik.http.routers.vaelor-login.entrypoints=websecure"
  #     - "traefik.http.routers.vaelor-login.tls=true"
  #     - "traefik.http.routers.vaelor-login.tls.certresolver=letsencrypt"
  #     - "traefik.http.services.vaelor-login.loadbalancer.server.port=80"
  #   depends_on:
  #     database:
  #       condition: service_healthy

volumes:
  db-data:
