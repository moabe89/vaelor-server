name: vaelor
services:
  database:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: canary
      MYSQL_USER: canary
      MYSQL_PASSWORD: vaelor2026
      MYSQL_ROOT_PASSWORD: vaelorRoot2026
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./canary/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10

  login:
    image: opentibiabr/login-server:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DBNAME: canary
      MYSQL_USER: canary
      MYSQL_PASS: vaelor2026
      SERVER_NAME: Vaelor
      SERVER_IP: funnyotserv.com.br
      SERVER_PORT: 7172
      SERVER_LOCATION: BRA
      LOGIN_HTTP_PORT: 80
      LOGIN_GRPC_PORT: 9090
    depends_on:
      database:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_USER: canary
      MYSQL_PASSWORD: vaelor2026
      MYSQL_DATABASE: canary
    ports:
      - "7171:7171"
      - "7172:7172"
    depends_on:
      database:
        condition: service_healthy

volumes:
  db-data:
