name: vaelor
# myAAC + canary + MariaDB
# myAAC roda na porta 8081 (host) -> 80 (container) — endpoint login.php
# Traefik usa 80/443 e evolution-api usa 8080, entao 8081 esta livre.
services:
  database:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canary}
      MYSQL_USER: ${MYSQL_USER:-canary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?obrigatorio - veja .env.example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?obrigatorio - veja .env.example}
    expose:
      - "3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./canary/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10

  aac:
    build:
      context: .
      dockerfile: Dockerfile.aac
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      # myAAC precisa ler config.lua do canary (mesmo arquivo, modo so leitura)
      - ./canary/config.lua:/canary/config.lua:ro
    depends_on:
      database:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_USER: ${MYSQL_USER:-canary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?obrigatorio - veja .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canary}
    ports:
      - "7171:7171"
      - "7172:7172"
    depends_on:
      database:
        condition: service_healthy

volumes:
  db-data:
